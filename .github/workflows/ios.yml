name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ios:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Capacitor core for native bridge import
        run: npm install --no-save @capacitor/core@6

      - name: Download web fallback assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/build
          base="https://www.gomocalc.com/build"
          curl --fail --retry 3 -L "$base/rapfi-single.js" -o public/build/rapfi-single.js
          curl --fail --retry 3 -L "$base/rapfi-single.wasm" -o public/build/rapfi-single.wasm
          curl --fail --retry 3 -L "$base/rapfi.data" -o public/build/rapfi.data

      - name: Download native Rapfi source and weights
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/dhbloo/rapfi.git third_party/rapfi
          git clone --depth 1 https://github.com/dhbloo/rapfi-networks.git third_party/rapfi-networks
          mkdir -p public/Rapfi
          cp native/config.toml public/Rapfi/config.toml
          cp third_party/rapfi-networks/classical/model210901.bin public/Rapfi/model210901.bin
          cp third_party/rapfi-networks/mix9svq/*.bin.lz4 public/Rapfi/

      - name: Build web assets into the app bundle
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          VUE_APP_CAPACITOR: '1'
        run: npm run build:ios

      - name: Install Capacitor CLI
        run: npm install --no-save @capacitor/ios@6 @capacitor/cli@6

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync local web assets into iOS project
        run: npx cap sync ios

      - name: Build native Rapfi bridge
        shell: bash
        run: |
          set -euo pipefail
          cap_header=$(find ios/App/Pods -path '*/Capacitor.h' -print -quit)
          test -n "$cap_header"
          cap_include=$(dirname "$(dirname "$cap_header")")
          cmake -S native -B native/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DRAPFI_SOURCE_DIR="$GITHUB_WORKSPACE/third_party/rapfi/Rapfi" \
            -DUSE_NEON=ON \
            -DUSE_NEON_DOTPROD=ON \
            -DCAPACITOR_INCLUDE_DIR="$cap_include"
          cmake --build native/build --config Release --parallel 3

      - name: Build unsigned iOS archive
        shell: bash
        run: |
          set -euo pipefail
          native_lib=$(find native/build -name 'librapfi_native.a' -print -quit)
          plugin_lib=$(find native/build -name 'librapfi_plugin.a' -print -quit)
          lz4_lib=$(find native/build -name 'liblz4.a' -print -quit)
          test -f "$native_lib"
          test -f "$plugin_lib"
          test -f "$lz4_lib"
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            OTHER_LDFLAGS='$(inherited) -ObjC -force_load '"$plugin_lib"' -force_load '"$native_lib"' '"$lz4_lib"' -lc++' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA for third-party signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          app_path="build/DerivedData/Build/Products/Debug-iphoneos/App.app"
          test -d "$app_path"
          rm -rf artifacts/Payload
          mkdir -p artifacts/Payload
          cp -R "$app_path" artifacts/Payload/App.app
          # An unsigned IPA is a zip with the standard Payload/App.app layout.
          ditto -c -k --sequesterRsrc --keepParent artifacts/Payload artifacts/GomokuCalculator-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GomokuCalculator-unsigned-ipa
          path: artifacts/GomokuCalculator-unsigned.ipa
